name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          # Test Environment - Mock values only
          APP_NAME=Gmail AI Organizer
          ENVIRONMENT=test
          DEBUG=False
          SECRET_KEY=test-secret-key-for-testing-only-not-secure

          # Server
          HOST=0.0.0.0
          PORT=8000

          # Database (in-memory for tests)
          DATABASE_URL=sqlite+aiosqlite:///:memory:

          # Google OAuth (mock values)
          GOOGLE_CLIENT_ID=mock_client_id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=mock_client_secret
          GOOGLE_REDIRECT_URI=http://localhost:8000/auth/callback
          GOOGLE_SCOPES=https://www.googleapis.com/auth/gmail.modify,https://www.googleapis.com/auth/calendar

          # AI Configuration (mock values)
          ANTHROPIC_API_KEY=mock_anthropic_key
          OPENAI_API_KEY=mock_openai_key
          PROJECT_ANTHROPIC_KEY=mock_project_anthropic_key
          PROJECT_OPENAI_KEY=mock_project_openai_key
          FREE_TIER_MONTHLY_LIMIT=100

          # AI Model Configuration
          DEFAULT_AI_PROVIDER=anthropic
          ANTHROPIC_MODEL=claude-3-5-sonnet-20241022
          OPENAI_MODEL=gpt-4-turbo-preview

          # Local AI
          LOCAL_AI_ENABLED=False
          LOCAL_AI_ENDPOINT=http://localhost:11434
          LOCAL_AI_MODEL=llama2

          # CORS
          CORS_ORIGINS=http://localhost:5173,http://localhost:3000
          CORS_ALLOW_CREDENTIALS=True
          EOF

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run test:coverage -- --run

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Check Python code formatting (informational)
        working-directory: ./backend
        run: |
          black --check app/ || echo "::warning::Black formatting issues found"

      - name: Lint Python code (informational)
        working-directory: ./backend
        run: |
          flake8 app/ --max-line-length=100 --extend-ignore=E501,W503,E203 --exclude=__pycache__ || echo "::warning::Flake8 issues found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint TypeScript code (informational)
        working-directory: ./frontend
        run: npm run lint || echo "::warning::ESLint issues found"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.backend-tests.result }}" == "success" ]; then
            echo "✅ Backend tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Backend tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.frontend-tests.result }}" == "success" ]; then
            echo "✅ Frontend tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend tests failed" >> $GITHUB_STEP_SUMMARY
          fi
